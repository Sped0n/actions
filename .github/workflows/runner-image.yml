name: Runner image

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/sped0n/runner
  UPSTREAM: ghcr.io/catthehacker/ubuntu:runner-latest

jobs:
  check:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      base: ${{ steps.check.outputs.base }}
      inputs: ${{ steps.check.outputs.inputs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check upstream and Dockerfile changes
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base_digest="$(docker buildx imagetools inspect "$UPSTREAM" --format '{{.Manifest.Digest}}')"
          inputs="$( { printf '%s\n' "$base_digest"; sha256sum runner-image/Dockerfile; } | sha256sum | cut -d ' ' -f 1)"
          printf 'base=%s@%s\ninputs=%s\n' "$UPSTREAM" "$base_digest" "$inputs" >> "$GITHUB_OUTPUT"

          if ! gh api users/sped0n/packages/container/runner --silent 2> "$RUNNER_TEMP/package-error"; then
            if grep -q 'HTTP 404' "$RUNNER_TEMP/package-error"; then
              printf 'changed=true\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat "$RUNNER_TEMP/package-error" >&2
            exit 1
          fi

          if docker buildx imagetools inspect "$IMAGE:latest" --raw > "$RUNNER_TEMP/current-index.json" 2> "$RUNNER_TEMP/registry-error"; then
            current="$(jq -r '.annotations["io.github.sped0n.runner.inputs"] // ""' "$RUNNER_TEMP/current-index.json")"
            if [ "$inputs" = "$current" ]; then
              printf 'changed=false\n' >> "$GITHUB_OUTPUT"
              printf 'Runner image unchanged; build skipped.\n' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          elif ! grep -Eiq 'not found|manifest unknown|name unknown' "$RUNNER_TEMP/registry-error"; then
            cat "$RUNNER_TEMP/registry-error" >&2
            exit 1
          fi
          printf 'changed=true\n' >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      amd64: ${{ steps.digest.outputs.amd64 }}
      arm64: ${{ steps.digest.outputs.arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.1
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
          buildkitd-flags: --debug=false

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: runner-image
          build-args: |
            BASE_IMAGE=${{ needs.check.outputs.base }}
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.IMAGE }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          # OCI indexes preserve the annotation used for change detection.
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true
          cache-from: type=gha,scope=runner-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=runner-${{ matrix.arch }}

      - name: Export architecture digest
        id: digest
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s=%s\n' "$ARCH" "$DIGEST" >> "$GITHUB_OUTPUT"

  publish:
    needs: [check, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      packages: write
    env:
      INPUT_HASH: ${{ needs.check.outputs.inputs }}
      AMD64_DIGEST: ${{ needs.build.outputs.amd64 }}
      ARM64_DIGEST: ${{ needs.build.outputs.arm64 }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-architecture image
        run: |
          : "${AMD64_DIGEST:?Missing AMD64 image digest}"
          : "${ARM64_DIGEST:?Missing ARM64 image digest}"
          candidate="$IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker buildx imagetools create --tag "$candidate" \
            --annotation "index:io.github.sped0n.runner.inputs=$INPUT_HASH" \
            "$IMAGE@$AMD64_DIGEST" "$IMAGE@$ARM64_DIGEST"
          digest="$(docker buildx imagetools inspect "$candidate" --format '{{.Manifest.Digest}}')"
          hash="${digest#sha256:}"
          docker buildx imagetools create --tag "$IMAGE:$hash" "$IMAGE@$digest"
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$digest"
          printf '### Runner image\n\n    %s:%s\n    %s:latest@%s\n' \
            "$IMAGE" "$hash" "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
