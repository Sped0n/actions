repos:
  - repo: local
    hooks:
      - id: nix-format
        name: Format Nix
        entry: nixfmt
        language: system
        files: '\.nix$'

      - id: python-fix
        name: Fix Python
        entry: ruff check --fix --force-exclude --no-cache
        language: system
        files: '\.py$'

      - id: python-organize-imports
        name: Organize Python imports
        entry: ruff check --fix --force-exclude --select=I001 --no-cache
        language: system
        files: '\.py$'

      - id: python-format
        name: Format Python
        entry: ruff format --force-exclude
        language: system
        files: '\.py$'

      - id: composite-action-urls
        name: Check explicit composite action URLs
        entry: ast-grep scan
        language: system
        pass_filenames: false
        files: '(^|/)action\.ya?ml$|^sgconfig\.yml$|^sg_rules/|^\.pre-commit-config\.yaml$'

      - id: workflow-lint
        name: Lint GitHub workflows
        entry: actionlint
        language: system
        files: '^\.github/workflows/[^/]+\.ya?ml$'
